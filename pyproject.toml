[project]
name = "odwi-llm"
version = "0.2.0"
description = "Provider-agnostic LLM access layer: a thin port (LLMPort) plus interchangeable adapters."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = [
    "llm",
    "provider-agnostic",
    "adapter",
    "port",
    "litellm",
    "any-llm",
    "gemini",
    "groq",
    "ollama",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]
dependencies = [
    "any-llm-sdk[gemini,groq,lmstudio,ollama]>=1.26.0",
    "litellm>=1.99.0",
    "pydantic>=2",
]

# Roadmap: PyPI. This metadata makes the package publishable, but there is
# deliberately no publish workflow yet - publishing waits until a real
# consumer (the AI Insights app) exercises the API. Not an oversight.
[project.urls]
Repository = "https://github.com/acdeveloper-sci/odwi-llm"
Issues = "https://github.com/acdeveloper-sci/odwi-llm/issues"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
files = ["src/odwi_llm"]

[[tool.mypy.overrides]]
# litellm ships no type information
module = ["litellm", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# the port is async (§4.6); let plain `async def test_*` be collected
asyncio_mode = "auto"
# llm_lab/ is a separate uv project nested in the repo - never collect it
norecursedirs = ["llm_lab", ".*", "build", "dist", "*.egg", "node_modules"]
