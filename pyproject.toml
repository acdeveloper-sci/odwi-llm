[project]
name = "odwi-llm"
version = "0.1.0"
description = "Provider-agnostic LLM access layer: a thin port (LLMPort) plus interchangeable adapters."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "any-llm-sdk[gemini,groq,lmstudio,ollama]>=1.26.0",
    "litellm>=1.99.0",
    "pydantic>=2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
files = ["src/odwi_llm"]

[[tool.mypy.overrides]]
# litellm ships no type information
module = ["litellm", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# the port is async (§4.6); let plain `async def test_*` be collected
asyncio_mode = "auto"
# llm_lab/ is a separate uv project nested in the repo - never collect it
norecursedirs = ["llm_lab", ".*", "build", "dist", "*.egg", "node_modules"]
