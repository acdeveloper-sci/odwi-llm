name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test + type-check (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      # Offline suite only: cassette replay for contract_shape, fakes for
      # contract. Never pass --live in CI (that spends real provider quota).
      - name: Run tests
        run: uv run pytest

      - name: Type-check
        run: uv run mypy src tests
